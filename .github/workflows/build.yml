name: LeviLauncher build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      # Sửa lỗi: Thêm submodules giống job build để đảm bảo kéo đủ file frontend về kiểm tra
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"

      - name: Build native loader from source
        working-directory: native/levilauncher
        shell: bash
        run: |
          xmake f -p windows -a x64 -m release --toolchain=msvc --deploy=y -y
          xmake -y

      - name: Test native loader
        working-directory: native/levilauncher
        shell: bash
        run: |
          xmake -y native_tests
          xmake run native_tests

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        shell: pwsh
        run: |
          go install ://github.com
          wails3 generate bindings -clean=true

      - name: Build frontend and enforce bundle budget
        working-directory: frontend
        run: npm run build

      - name: Test and vet Go code
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          go test -race ./internal/downloader ./internal/curseforge/client


  build:
    needs: quality
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci" >> "$GITHUB_ENV"
          fi

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"

      - name: Build native loader from source
        working-directory: native/levilauncher
        shell: bash
        run: |
          xmake f -p windows -a x64 -m release --toolchain=msvc --deploy=y -y
          xmake -y

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      - name: Build LeviLauncher.exe
        shell: pwsh
        run: |
          go install ://github.com
          wails3 task windows:build PRODUCTION=true

      - name: Build installers
        shell: pwsh
        run: |
          ./packaging/wix/build.ps1 `
            -Version $env:VERSION `
            -Arch x64 `
            -BinDir bin `
            -OutDir dist

      - name: Build installers for the installer tests
        shell: pwsh
        run: |
          foreach ($version in '0.0.1', '0.0.2') {
            ./packaging/wix/build.ps1 -Version $version -Arch x64 -BinDir bin -OutDir installer-test
          }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-test
          path: installer-test/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: bin/LeviLauncher.exe
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/LeviLauncher-${{ env.VERSION }}-win-x64.msi
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/LeviLauncher-${{ env.VERSION }}-win-x64-setup.exe
          archive: false
          if-no-files-found: error

  installer-test:
    name: Installer tests
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-test
          path: installer-test

      - name: Download the Inno Setup installer of v1.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.7 --repo "${{ github.repository }}" --pattern LeviLauncher-amd64-installer.exe --dir inno

      - name: Run installer tests
        shell: powershell
        run: ./packaging/wix/test.ps1 -ArtifactsDir installer-test -Arch x64 -InnoSetup inno/LeviLauncher-amd64-installer.exe

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs
          path: installer-test/logs/
